services:
  taskforge-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: taskforge-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=taskforge-postgres;Port=5432;Database=taskforge_db;Username=taskforge_user;Password=TaskForgePass123!;SearchPath=public
      - JwtSettings__SecretKey=SuperSecretKeyForTaskForgeBackend1234567890!
    depends_on:
      taskforge-postgres:
        condition: service_healthy

  taskforge-postgres:
    image: postgres:16-alpine
    container_name: taskforge-postgres
    restart: always
    environment:
      POSTGRES_DB: taskforge_db
      POSTGRES_USER: taskforge_user
      POSTGRES_PASSWORD: TaskForgePass123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge_user -d taskforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
